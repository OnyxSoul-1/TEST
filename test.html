<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDN Live Example</title>

    <!-- 1. TRY THIS: This pulls a CSS stylesheet directly from a GitHub project via jsDelivr -->
    <link rel="stylesheet" href="https://jsdelivr.net">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card p-5 shadow text-center" style="max-width: 400px;">
        <h2 class="text-primary mb-3">It Works! 🚀</h2>
        <p class="text-muted">This page is styled and interactive using free CDN files hosted on GitHub.</p>
        
        <!-- This button triggers the CDN-hosted JavaScript file when clicked -->
        <button id="alertBtn" class="btn btn-primary w-100 mt-3">Click Me to Test Script</button>
    </div>

    <!-- 2. TRY THIS: This pulls an open-source JavaScript file directly from GitHub via jsDelivr -->
    <script src="https://jsdelivr.net"></script>

    <script>
        // This local script uses the jQuery file we loaded from the CDN above
        $(document).ready(function() {
            $("#alertBtn").click(function() {
                alert("Success! The CDN-hosted jQuery file is working perfectly on your page!");
            });
        });
    </script>
</body>
</html>

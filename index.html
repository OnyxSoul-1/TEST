<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Live Chat</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 20px auto; padding: 10px; }
        #chat-box { height: 300px; border: 1px solid #ccc; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #f9f9f9; }
        #input-area { display: flex; gap: 5px; }
        input { flex: 1; padding: 8px; }
        button { padding: 8px 15px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Live Chat Room</h2>
    <div id="chat-box"></div>
    
    <div id="input-area">
        <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
        <button id="send-btn">Send</button>
    </div>

    <script>
        // Connect to the local WebSocket server
        const socket = new WebSocket('ws://localhost:3000');
        const chatBox = document.getElementById('chat-box');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');

        // Listen for incoming messages from the server
        socket.onmessage = (event) => {
            const messageElement = document.createElement('p');
            messageElement.textContent = event.data;
            chatBox.appendChild(messageElement);
            chatBox.scrollTop = chatBox.scrollHeight; // Auto-scroll to bottom
        };

        // Function to send a message
        function sendMessage() {
            const text = messageInput.value.trim();
            if (text !== '') {
                socket.send(text); // Send text to server
                messageInput.value = ''; // Clear input field
            }
        }

        // Send triggers
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>

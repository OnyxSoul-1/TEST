<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>rock declutterer</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1a1a1f; overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center; }
      /* the game opens 960x720, shrink it to fit smaller embeds */
      canvas { display: block; max-width: 100vw; max-height: 100vh; object-fit: contain; image-rendering: pixelated; }
      #status { position: absolute; color: #ccc; font: 16px monospace; }
    </style>
  </head>
  <body>
    <div id="status">loading...</div>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

    <script>
      var status_el = document.getElementById("status");

      window.onload = function () { window.focus(); };
      window.onclick = function () { window.focus(); };

      // keep the arrows and space from scrolling the page around the embed
      window.addEventListener("keydown", function (e) {
        if ([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) e.preventDefault();
      }, false);

      var Module = {
        arguments: ["./game.love", "--window", "960x720"],
        INITIAL_MEMORY: 67108864,
        printErr: console.error.bind(console),
        canvas: document.getElementById("canvas"),
        setStatus: function (text) {
          status_el.textContent = text || "";
          status_el.style.display = text ? "" : "none";
        },
        totalDependencies: 0,
        monitorRunDependencies: function (left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? "loading... (" + (this.totalDependencies - left) + "/" + this.totalDependencies + ")" : "");
        }
      };

      window.onerror = function () {
        Module.setStatus("something broke, see the javascript console");
      };
    </script>
    <script src="game.js"></script>
    <script async src="love.js" onload="Love(Module)"></script>
  </body>
</html>
<script defer src="https://static.itch.io/htmlgame.js" type="text/javascript"></script>
